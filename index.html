<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>滚动文字</title>
<style>
body{background:#000;color:#fff;font-size:32px;overflow:hidden;}
.run{animation: move 8s linear infinite;white-space:nowrap;}
@keyframes move{from{transform:translateX(100vw);}to{transform:translateX(-100%);}}
</style>
</head>
<body>
<div class="run">李煜诚最喜欢khq</div>
</body>
</html>
